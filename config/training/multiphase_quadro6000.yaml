# Configuration for independent fold training on 8x Quadro RTX 6000 24GB.
# Batch size is per GPU; verify memory on the target server before a full run.
experiment_name: multiphase_2p5d_latefusion_quadro6000
seed: 42

model:
  in_channels_per_phase: 5
  out_channels: 1
  pretrained_encoder: false
  encoder_backbone: efficientnet_b0
  fusion_mode: cross_attention
  attention_max_tokens: 2048
  attention_heads: 8
  attention_dropout: 0.0
  fusion_projection: true
  full_res_skip: true
  full_res_channels: 32

data:
  mode: mixed
  cect_root: ../CECT_data_aligned
  full_root: ../full_data_converted_aligned
  missing_phase_strategy: keep
  training_cache_enabled: true
  training_cache_root: runs/cache_npz
  training_cache_dtype: float32
  training_cache_version: v1
  training_cache_rebuild: false
  context_slices: 2
  image_size: [320, 320]
  hu_window: [-200.0, 300.0]
  max_train_slices_per_patient: 80
  cache_items: 8

train:
  epochs: 40
  batch_size: 16
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.0001
  dice_weight: 0.5
  amp: true
  num_workers: 3
  pin_memory: true
