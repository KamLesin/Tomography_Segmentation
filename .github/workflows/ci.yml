name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall src scripts

      - name: CLI smoke tests
        run: |
          python src/train.py --help
          python scripts/sanna_prepare.py --help
          python scripts/add_tumor_data.py --help
          python scripts/prepare_metadata_for_folds.py --help
          python scripts/prepare_metadata/split_into_folds.py --help
          python scripts/run_full_pipeline.py --help
